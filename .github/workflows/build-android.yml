name: Build Android
on:
  push:
    branches: [Patch]
  workflow_dispatch:
jobs:
  Android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main
      - name: Setup Java JDK
        uses: actions/setup-java@main
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.4
      - name: Install Libraries
        run: |
          haxelib install hmm --quiet
          haxelib run hmm install --quiet
      - name: Install extra libraries
        run: |
          haxelib install format --quiet
          haxelib install hxp --quiet
      - name: Build hxcpp tool
        run: |
          cd "$(haxelib libpath hxcpp)/tools/hxcpp"
          haxe compile.hxml
      - name: Configure Android
        run: |
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_LATEST_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME
          haxelib run lime config ANDROID_SETUP true
      - name: Compile
        run: |
          # SScript menanyakan pengaturan pada compile pertama (jawab n = bawaan), lalu keluar dengan kode 1.
          # Jadi dijalankan dua kali: yang pertama hanya untuk membuat berkas pengaturannya.
          echo n | haxelib run lime build android || true
          haxelib run lime build android
      - name: Upload Artifact
        uses: actions/upload-artifact@main
        with:
          name: androidBuild
          path: export/release/android/bin/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
